[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-ii-engine"
version = "0.1.0"
description = "Measurement-driven LLM inference benchmarking, diagnostics, prediction, and configuration optimization engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Harsh", email = "harsh@example.com" },
]
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "fastapi>=0.110.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_ii_engine"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = ["E501", "UP042", "UP046"]

